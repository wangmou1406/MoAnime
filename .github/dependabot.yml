version: 2
updates:
  # Python 依赖
  - package-ecosystem: pip
    directory: /source
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]

  # GitHub Actions 自身
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  # 桌面版宿主（.NET + WebView2）
  - package-ecosystem: nuget
    directory: /desktop/webview2-host
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "desktop"]
