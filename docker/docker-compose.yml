# ============================================================
#  动漫下载机 Anime Downloader —— docker compose 编排
#
#  用法：
#     docker compose up -d --build      # 构建并后台启动
#     docker compose logs -f            # 看日志
#     docker compose down               # 停止
#
#  启动后浏览器打开 http://localhost:8848
#
#  镜像内已自带 ffmpeg 与 Chromium 内核，宿主机不需要装任何东西。
#
#  ------------------------------------------------------------
#  **下载路径可在本文件里改**（也可以写到同目录的 .env，见 .env.example）：
#      AD_DOWNLOAD_HOST   宿主机上放视频/字幕的目录  ← 最常改的就是这个
#      AD_DATA_HOST       宿主机上放数据库/设置/日志的目录
#      AD_IN_DOWNLOAD     容器内的下载目录（只有想改容器内布局时才动）
#
#  例：NAS 上放视频
#      AD_DOWNLOAD_HOST: "/volume1/video/anime"
#  例：Windows 上放 D 盘
#      AD_DOWNLOAD_HOST: "D:/Anime"
# ============================================================
services:
  anime-downloader:
    build:
      # 上下文必须是项目根（那里才有 core/ web/ static/）
      context: ../source
      dockerfile: ../docker/Dockerfile
      args:
        # 国内网络拉 Chromium 慢的话，把下面这行取消注释（约 36 秒 vs 50 分钟）
        # PLAYWRIGHT_DOWNLOAD_HOST: "https://cdn.npmmirror.com/binaries/playwright"
        NODE_VERSION: "22.11.0"
        PLAYWRIGHT_VERSION: "1.64.1"
    image: anime-downloader:latest
    container_name: anime-downloader
    restart: unless-stopped

    ports:
      # 左边是宿主机端口，若 8848 被占用改成例如 18848:8848
      - "${AD_HOST_PORT:-8848}:8848"

    volumes:
      # 注意：compose 里的相对路径是相对**本文件所在目录**（docker/）解析的，
      # 所以要回到上一级去找项目根下的 downloads / docker-data。
      # 数据库 / 设置 / 日志 / 缩略图缓存 / 检索历史
      - "${AD_DATA_HOST:-./docker-data}:/data"
      # 下载好的视频与字幕：宿主机路径 ←→ 容器内路径，两端都由变量控制
      - "${AD_DOWNLOAD_HOST:-./downloads}:${AD_IN_DOWNLOAD:-/downloads}"

    environment:
      # 这些会覆盖界面里的设置，容器部署建议只用环境变量
      AD_DATA_DIR: /data
      AD_LOG_DIR: /data/logs
      AD_DOWNLOAD_DIR: "${AD_IN_DOWNLOAD:-/downloads}"
      # 刻意不设 AD_TEMP_DIR：程序会自动跟随 AD_DOWNLOAD_DIR 用 <下载目录>/.tmp，
      # 这样只改下载目录就够了，不必再改第二处。
      AD_HOST: 0.0.0.0
      AD_PORT: "8848"
      AD_CONCURRENT_TASKS: "${AD_CONCURRENT_TASKS:-3}"   # 同时下载的剧集数
      AD_SEGMENT_THREADS: "${AD_SEGMENT_THREADS:-8}"     # 单任务分片并发
      AD_LOG_LEVEL: "${AD_LOG_LEVEL:-INFO}"
      AD_THEME: "${AD_THEME:-light}"
      # 需要走代理时打开（容器里访问宿主机用 host.docker.internal）
      # AD_PROXY: "http://host.docker.internal:7890"

    # 让容器能通过 host.docker.internal 访问宿主机（例如宿主机上的代理）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Chromium 在容器里需要一块够大的 /dev/shm，否则可能启动失败
    # （player_sniffer.js 已带 --disable-dev-shm-usage，这里是双保险）
    shm_size: "1gb"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/api/meta"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
